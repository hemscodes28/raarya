name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Bundle & Sync Capacitor iOS
        run: |
          npm run build
          npx cap sync ios

      - name: Build iOS Archive and Package IPA
        run: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ./build/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

          mkdir -p Payload
          APP_DIR=$(find ./build/App.xcarchive/Products/Applications -name "*.app" | head -n 1)
          if [ -z "$APP_DIR" ]; then
            APP_DIR=$(find ./build -name "*.app" | head -n 1)
          fi
          
          echo "Found app bundle at: $APP_DIR"
          cp -r "$APP_DIR" Payload/
          zip -r RaaryaProperties.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RaaryaProperties-iOS-IPA
          path: ios/App/RaaryaProperties.ipa
          retention-days: 14
